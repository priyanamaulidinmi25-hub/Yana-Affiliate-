<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- BYPASS HOTLINKING / IN-APP BROWSER TIKTOK -->
    <meta name="referrer" content="no-referrer">
    
    <title id="page-title">Detail Produk - Yana Affiliate</title>

    <!-- SEO & METADATA -->
    <meta name="description" content="Detail spesifikasi produk dan link pembelian affiliate resmi terpercaya dari Yana Affiliate.">
    <meta name="author" content="Priyana Maulidin">

    <!-- OPEN GRAPH / SOCIAL MEDIA META TAGS -->
    <meta property="og:type" content="product">
    <meta property="og:title" id="og-title" content="Detail Produk - Yana Affiliate">
    <meta property="og:description" id="og-desc" content="Beli sekarang melalui link affiliate terverifikasi dengan harga terbaik.">
    <meta property="og:image" id="og-image" content="https://yana-affiliate.netlify.app/assets/og-image.jpg">

    <!-- FAVICON (Dynamic SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23FE2C55%22/><text y=%22.9em%22 x=%2222%22 font-size=%2260%22 font-weight=%22bold%22 fill=%22white%22>Y</text></svg>">

    <!-- GOOGLE FONTS: INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>

    <!-- HEADER / NAVIGATION -->
    <header class="app-header">
        <div class="header-container nav-back-bar">
            <a href="index.html" class="btn-back" aria-label="Kembali ke katalog">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <div class="brand-info">
                <div class="logo-wrapper" id="site-logo-container">
                    <span class="logo-fallback">Y</span>
                </div>
                <h1 class="site-title" id="site-name-text">Yana Affiliate</h1>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-layout detail-page-layout">

        <!-- LOADING STATE -->
        <div id="loading-state" class="state-container">
            <div class="spinner"></div>
            <p>Memuat detail produk...</p>
        </div>

        <!-- ERROR / NOT FOUND STATE -->
        <div id="error-state" class="state-container hidden">
            <div class="state-icon">🔍</div>
            <h3>Produk Tidak Ditemukan</h3>
            <p id="error-message">Produk yang Anda cari tidak tersedia atau telah disembunyikan.</p>
            <a href="index.html" class="btn-retry" style="display: inline-block; text-decoration: none;">Kembali ke Katalog</a>
        </div>

        <!-- PRODUCT DETAIL CONTAINER -->
        <article id="product-detail-card" class="product-detail-card hidden">
            <div class="detail-gallery">
                <img id="detail-image" src="" alt="Foto Produk" loading="eager" referrerpolicy="no-referrer">
                <span id="detail-category-badge" class="category-badge"></span>
            </div>

            <div class="detail-info">
                <h1 id="detail-name" class="detail-title"></h1>
                <div id="detail-price" class="detail-price"></div>

                <div class="detail-description-section">
                    <h3>Deskripsi Produk</h3>
                    <p id="detail-short-description" class="short-desc"></p>
                    <div id="detail-description" class="full-desc"></div>
                </div>

                <div class="detail-actions">
                    <a id="detail-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-buy-full">
                        Beli Sekarang
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </article>

        <!-- RELATED PRODUCTS SECTION -->
        <section id="related-products-section" class="related-section hidden">
            <h2 class="section-heading">Produk Terkait</h2>
            <div id="related-products-grid" class="product-grid">
                <!-- Dynamic Related Products -->
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
        <p>&copy; 2026 <span id="footer-site-name">Yana Affiliate</span>. All rights reserved.</p>
    </footer>

    <!-- ENTRY POINT JS -->
    <script type="module" src="js/product-detail.js"></script>
</body>
</html>
